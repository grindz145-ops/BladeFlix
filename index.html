        <input id="search" type="search" placeholder="Search videos…" aria-label="Search videos">
      </div>
    </div>
  </header>

  <main class="main">
    <section id="new-row" class="new-row" hidden>
      <h2>New this week</h2>
      <div id="new-grid" class="grid"></div>
    </section>

    <section class="filters">
      <div id="tag-chips" class="tag-chips" aria-label="Filter by tag"></div>
      <p id="result-count" class="result-count"></p>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>No videos match these filters.</p>
  </main>

  <footer class="site-footer">
    <p>BladeFlix is a curated index of rollerblading videos. All videos are embedded from YouTube and belong to their creators — click any card to watch, or follow the “Watch on YouTube” link to support the original channel.</p>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-close aria-label="Close">&times;</button>
      <div class="player-wrap">
        <iframe id="player" src="" title="YouTube video player" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>
      <h3 id="modal-title"></h3>
      <p id="modal-meta"></p>
      <a id="modal-link" href="#" target="_blank" rel="noopener">Watch on YouTube ↗</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
